
name: CI - Backend

on:
  push:
    branches:
      - main
      - feature/ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testes e Docker - Backend
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: sistema_reserva_salas_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres_test_123

      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sistema_reserva_salas_test
      DB_USER: postgres
      DB_PASSWORD: postgres_test_123

      # Usar somente se a configuração da API reconhecer esta variável.
      DB_SSL: "false"

      # Chave exclusiva para testes automatizados.
      JWT_SECRET: chave-temporaria-exclusiva-do-ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_123
          POSTGRES_DB: sistema_reserva_salas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sistema_reserva_salas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe JavaScript
        run: |
          find src -type f -name "*.js" -exec node --check {} \;
          if [ -d tests ]; then
            find tests -type f -name "*.js" -exec node --check {} \;
          fi

      - name: Executar migrations
        run: npx sequelize-cli db:migrate --env test

      - name: Executar testes Jest
        run: npm run test:ci

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem Docker da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sistema-reserva-salas-api:ci
